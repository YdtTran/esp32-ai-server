name: xiaozhi-local-voice

services:
  ollama:
    image: ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_KEEP_ALIVE: "60s"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  ollama-init:
    image: ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama show qwen3:1.7b >/dev/null 2>&1 || ollama pull qwen3:1.7b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cuda@sha256:6ec12ebf890a17e0d4b242a8ba9e0eb1fb836e60e8a3c857aea9838d541579ac
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      LOOPBACK_HOST_URL: "http://127.0.0.1:8000"
      LOG_LEVEL: info
      ENABLE_UI: "false"
      PRELOAD_MODELS: "[]"
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: int8
      STT_MODEL_TTL: "60"
      TTS_MODEL_TTL: "60"
    volumes:
      - speaches-hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
  speaches-init:
    image: ghcr.io/speaches-ai/speaches:latest-cuda@sha256:6ec12ebf890a17e0d4b242a8ba9e0eb1fb836e60e8a3c857aea9838d541579ac
    entrypoint: ["python", "/prepare_speaches.py"]
    volumes:
      - ./docker/local-voice/prepare_speaches.py:/prepare_speaches.py:ro
    depends_on:
      speaches:
        condition: service_healthy
  piper:
    build:
      context: ./docker/local-voice/piper
    restart: unless-stopped
    ports:
      - "127.0.0.1:15000:5000"
    volumes:
      - piper-voices:/voices
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 120s
  server:
    build:
      context: .
      dockerfile: Dockerfile-server
    restart: unless-stopped
    stdin_open: true
    ports:
      - "8000:8000"
      - "8003:8003"
    volumes:
      - ./main/xiaozhi-server/data:/opt/xiaozhi-esp32-server/data
      - ./main/xiaozhi-server/config.local-voice.yaml:/opt/xiaozhi-esp32-server/data/.config.yaml:ro
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      speaches-init:
        condition: service_completed_successfully
      piper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/xiaozhi/ota/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s

volumes:
  ollama-models:
  speaches-hf-hub-cache:
  piper-voices:
